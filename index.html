<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Late Shift — Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="player">
  <!-- LEFT: turntable stage -->
  <div class="stage">
    <div class="station">ON AIR · LATE SHIFT</div>
    <div class="disc-wrap">
      <div class="disc" id="disc"></div>
      <div class="tonearm" id="tonearm">
        <svg viewBox="0 0 80 80">
          <line x1="70" y1="10" x2="20" y2="55" stroke="#8a7a5c" stroke-width="4" stroke-linecap="round"/>
          <circle cx="70" cy="10" r="7" fill="#8a7a5c"/>
          <circle cx="20" cy="55" r="4" fill="#E8A33D"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- RIGHT: info + controls -->
  <div class="panel">
    <div class="meta-eyebrow" id="trackCount">TRACK 1 / 5</div>
    <h1 class="title" id="title">Midnight Static</h1>
    <p class="artist" id="artist">The Analog Room</p>

    <div class="progress-row">
      <span class="time" id="currentTime">0:00</span>
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
        <div class="progress-knob" id="progressKnob"></div>
      </div>
      <span class="time right" id="duration">0:00</span>
    </div>

    <div class="transport">
      <button class="btn" id="prevBtn" aria-label="Previous track">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="btn play" id="playBtn" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="btn" id="nextBtn" aria-label="Next track">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
      </button>
    </div>

    <div class="lower-row">
      <div class="volume">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12z"/></svg>
        <div class="volume-track" id="volumeTrack">
          <div class="volume-fill" id="volumeFill"></div>
          <div class="volume-knob" id="volumeKnob"></div>
        </div>
      </div>
      <div class="modes">
        <button class="mode-btn active" id="autoplayBtn" title="Auto-advance to next track">AUTO</button>
        <button class="mode-btn" id="loopBtn" title="Repeat current track">LOOP</button>
        <button class="mode-btn" id="shuffleBtn" title="Shuffle playlist">SHUF</button>
      </div>
    </div>

    <ul class="playlist" id="playlist"></ul>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script src="script.js"></script>

</body>
</html>
